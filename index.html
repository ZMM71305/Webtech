<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Feedback System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- QR Code View -->
        <div id="qr-view" class="view card">
            <img src="logo.png" alt="Hotel Cuna Logo" class="logo">
            <h1>We Value Your Feedback</h1>
            <p>Please scan the QR code below to share your experience with us.</p>
            <div class="qr-code">
                <a href="feedback.html">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=feedback.html" alt="QR Code">
                </a>
            </div>
            <p class="small-text">Scan the QR code or click it to open the feedback form.</p>
            <a href="feedback-list.html" class="nav-link">View All Feedback</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
