<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Feedback System - Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Feedback Form View -->
        <div id="feedback-view" class="view card">
            <img src="logo.png" alt="Hotel Cuna Logo" class="logo">
            <h1>Share Your Feedback</h1>
            <p>How was your stay?</p>
            <form id="feedback-form">
                <div class="rating">
                    <input type="radio" name="rating" id="star5" value="5" required><label for="star5">★</label>
                    <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                    <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                    <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                    <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
                </div>
                <div class="form-group">
                    <textarea id="comments" name="comments" rows="4" placeholder="Tell us more about your experience..." required></textarea>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Enter your email (optional)">
                </div>
                <button type="submit">Submit Feedback</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
