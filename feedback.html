<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="feedback.css">
</head>
<body>
    <div class="container">
        <h1>Leave Your Feedback</h1>
        <form id="feedback-form">
            <div class="form-group">
                <label>Rating</label>
                <div class="rating">
                    <input type="radio" name="rating" id="star5" value="5" required><label for="star5">★</label>
                    <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                    <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                    <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                    <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
                </div>
            </div>
            <div class="form-group">
                <label for="comments">Comments</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Tell us about your experience..." required></textarea>
            </div>
            <button type="submit">Submit Feedback</button>
        </form>
        <p class="success-message" id="success-message" style="display:none;">Thank you for your feedback!</p>
        <a href="view_feedback.html" class="view-feedback-link">View All Feedback</a>
    </div>
    <script src="feedback.js"></script>
</body>
</html>
